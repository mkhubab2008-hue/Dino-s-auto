<svg xmlns="http://www.w3.org/2000/svg" width="800" height="560" viewBox="0 0 800 560">
  <rect width="800" height="560" fill="#fafafa"/>
  <text x="400" y="30" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#222">Dino Game Auto-Jumper Wiring</text>

  <!-- Arduino Uno -->
  <rect x="60" y="90" width="220" height="340" rx="8" fill="#1b6ea3" stroke="#0d3f5c" stroke-width="2"/>
  <text x="170" y="115" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#fff">Arduino Uno</text>

  <!-- Arduino pin labels/points -->
  <circle cx="80" cy="160" r="5" fill="#ffd54f"/>
  <text x="95" y="165" font-family="Arial" font-size="13" fill="#fff">5V</text>

  <circle cx="80" cy="200" r="5" fill="#9e9e9e"/>
  <text x="95" y="205" font-family="Arial" font-size="13" fill="#fff">GND</text>

  <circle cx="80" cy="240" r="5" fill="#66bb6a"/>
  <text x="95" y="245" font-family="Arial" font-size="13" fill="#fff">A0</text>

  <circle cx="80" cy="280" r="5" fill="#ffb74d"/>
  <text x="95" y="285" font-family="Arial" font-size="13" fill="#fff">Pin 8</text>

  <!-- LDR module -->
  <rect x="480" y="90" width="180" height="120" rx="6" fill="#4caf50" stroke="#2e7d32" stroke-width="2"/>
  <text x="570" y="115" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">LDR Module</text>
  <circle cx="500" cy="150" r="5" fill="#ffd54f"/>
  <text x="515" y="155" font-family="Arial" font-size="13" fill="#fff">VCC</text>
  <circle cx="500" cy="175" r="5" fill="#9e9e9e"/>
  <text x="515" y="180" font-family="Arial" font-size="13" fill="#fff">GND</text>
  <circle cx="500" cy="200" r="5" fill="#66bb6a"/>
  <text x="515" y="205" font-family="Arial" font-size="13" fill="#fff">AO</text>

  <!-- Servo -->
  <rect x="480" y="280" width="180" height="130" rx="6" fill="#e57373" stroke="#b71c1c" stroke-width="2"/>
  <text x="570" y="305" text-anchor="middle" font-family="Arial" font-size="15" font-weight="bold" fill="#fff">Servo Motor</text>
  <circle cx="500" cy="340" r="5" fill="#ffd54f"/>
  <text x="515" y="345" font-family="Arial" font-size="13" fill="#fff">VCC (red)</text>
  <circle cx="500" cy="365" r="5" fill="#9e9e9e"/>
  <text x="515" y="370" font-family="Arial" font-size="13" fill="#fff">GND (brown)</text>
  <circle cx="500" cy="390" r="5" fill="#ffb74d"/>
  <text x="515" y="395" font-family="Arial" font-size="13" fill="#fff">Signal (orange)</text>

  <!-- Wires -->
  <!-- 5V to LDR VCC -->
  <path d="M80,160 C 300,160 300,150 500,150" stroke="#ffd54f" stroke-width="2.5" fill="none"/>
  <!-- GND to LDR GND -->
  <path d="M80,200 C 320,200 320,175 500,175" stroke="#9e9e9e" stroke-width="2.5" fill="none"/>
  <!-- A0 to LDR AO -->
  <path d="M80,240 C 340,240 340,200 500,200" stroke="#66bb6a" stroke-width="2.5" fill="none"/>

  <!-- 5V to Servo VCC -->
  <path d="M80,160 C 260,160 260,340 500,340" stroke="#ffd54f" stroke-width="2.5" fill="none" stroke-dasharray="1,0"/>
  <!-- GND to Servo GND -->
  <path d="M80,200 C 280,200 280,365 500,365" stroke="#9e9e9e" stroke-width="2.5" fill="none"/>
  <!-- Pin 8 to Servo Signal -->
  <path d="M80,280 C 300,280 300,390 500,390" stroke="#ffb74d" stroke-width="2.5" fill="none"/>

  <!-- Legend -->
  <text x="60" y="460" font-family="Arial" font-size="13" fill="#333">Legend:</text>
  <line x1="60" y1="475" x2="90" y2="475" stroke="#ffd54f" stroke-width="3"/>
  <text x="95" y="480" font-family="Arial" font-size="12" fill="#333">Power (5V)</text>
  <line x1="220" y1="475" x2="250" y2="475" stroke="#9e9e9e" stroke-width="3"/>
  <text x="255" y="480" font-family="Arial" font-size="12" fill="#333">Ground</text>
  <line x1="350" y1="475" x2="380" y2="475" stroke="#66bb6a" stroke-width="3"/>
  <text x="385" y="480" font-family="Arial" font-size="12" fill="#333">LDR Analog Signal (A0)</text>
  <line x1="580" y1="475" x2="610" y2="475" stroke="#ffb74d" stroke-width="3"/>
  <text x="615" y="480" font-family="Arial" font-size="12" fill="#333">Servo PWM Signal (Pin 8)</text>

</svg>
